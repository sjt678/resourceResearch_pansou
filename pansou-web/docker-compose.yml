      - CACHE_ENABLED=true
      - CACHE_PATH=/app/cache
      - CACHE_MAX_SIZE=100
      - CACHE_TTL=60
      - ASYNC_PLUGIN_ENABLED=true
      - ASYNC_RESPONSE_TIMEOUT=4
      - ASYNC_MAX_BACKGROUND_WORKERS=20
      - ASYNC_MAX_BACKGROUND_TASKS=100
      - ASYNC_CACHE_TTL_HOURS=1
      - CHECK_CONCURRENCY=3
      - CHECK_TOTAL_TIMEOUT=25
      # TMDB 搜索建议配置
      - TMDB_API_KEY=13bf320bec60b9a3c2ec2bbf92efa85c
      - TMDB_BASE_URL=https://tmdb-proxy.songjt90.workers.dev/3
      # TG 搜索反代（国内服务器被墙时配置，绕过 t.me 访问限制）
